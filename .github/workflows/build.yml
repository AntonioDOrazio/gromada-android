name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure (NDK, arm64-v8a)
        run: |
          echo "NDK: $ANDROID_NDK_LATEST_HOME"
          cmake -S . -B build-android -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build-android
      - name: Strip
        run: |
          "$ANDROID_NDK_LATEST_HOME"/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip \
            build-android/gromada_libretro_android.so
      - uses: actions/upload-artifact@v4
        with:
          name: gromada_libretro_android-arm64-v8a
          path: |
            build-android/gromada_libretro_android.so
            gromada_libretro.info

  # Android installer (android/installer): JVM tests of the extraction logic, desktop CLI
  # jar and the APK (signed with the repo's public debug key, see docs/installer.md).
  installer:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android/installer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Test extraction logic (JVM)
        run: ./gradlew --no-daemon :common:test :common:cliJar
      - name: Build APK
        run: |
          ./gradlew --no-daemon :app:assembleRelease :app:lintRelease
          cat app/build/reports/lint-results.txt
      - name: Inspect APK
        run: |
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$bt/aapt2" dump badging app/build/outputs/apk/release/app-release.apk | grep -E "^package|sdkVersion|uses-permission|launchable"
          "$bt/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk | head -3
      - name: Collect
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/dist/gromada-installer.apk"
          cp common/build/libs/gromada-extract.jar "$GITHUB_WORKSPACE/dist/"
      - uses: actions/upload-artifact@v4
        with:
          name: gromada-installer
          path: |
            dist/gromada-installer.apk
            dist/gromada-extract.jar
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: installer-reports
          path: |
            android/installer/common/build/reports
            android/installer/app/build/reports

  # Rolling "nightly" pre-release: a fixed public link the handheld (and the installer
  # app, via the GitHub API) can download from. Published only from main.
  release:
    needs: [android, installer]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish nightly release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          core=artifacts/gromada_libretro_android-arm64-v8a
          inst=artifacts/gromada-installer
          gh release delete nightly --yes --cleanup-tag || true
          gh release create nightly --prerelease --target "$GITHUB_SHA" \
            --title "Nightly (${GITHUB_SHA::7})" \
            --notes "Build automatica dell'ultimo commit su main. Su Android installa gromada-installer.apk: estrae il gioco dal CD, scarica questo core e lo installa in RetroArch (vedi docs/installer.md). A mano: installa gromada_libretro_android.so con Carica core → Installa o ripristina un core. gromada-extract.jar: estrazione da riga di comando (java -jar gromada-extract.jar GROMADA.cue cartella)." \
            "$core/build-android/gromada_libretro_android.so" "$core/gromada_libretro.info" \
            "$inst/gromada-installer.apk" "$inst/gromada-extract.jar"

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install clang + libc++
        run: sudo apt-get update && sudo apt-get install -y clang-18 libc++-18-dev libc++abi-18-dev ninja-build
      - name: Build
        run: |
          CXX=clang++-18 cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DGROMADA_BUILD_TESTS=ON
          cmake --build build
      - name: Test (game-data tests are skipped in CI)
        run: cd build && ctest --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: gromada_libretro-linux-x86_64
          path: build/gromada_libretro.so
