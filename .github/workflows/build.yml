name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure (NDK, arm64-v8a)
        run: |
          echo "NDK: $ANDROID_NDK_LATEST_HOME"
          cmake -S . -B build-android -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build-android
      - name: Strip
        run: |
          "$ANDROID_NDK_LATEST_HOME"/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip \
            build-android/gromada_libretro_android.so
      - uses: actions/upload-artifact@v4
        with:
          name: gromada_libretro_android-arm64-v8a
          path: |
            build-android/gromada_libretro_android.so
            gromada_libretro.info
      # Rolling "nightly" pre-release: a fixed public link the handheld can download from.
      - name: Publish nightly release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nightly --yes --cleanup-tag || true
          gh release create nightly --prerelease --target "$GITHUB_SHA" \
            --title "Nightly ($(git rev-parse --short HEAD))" \
            --notes "Build automatica dell'ultimo commit su main. Copia gromada_libretro_android.so nella cartella dei core di RetroArch e gromada_libretro.info nella cartella info." \
            build-android/gromada_libretro_android.so gromada_libretro.info

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install clang + libc++
        run: sudo apt-get update && sudo apt-get install -y clang-18 libc++-18-dev libc++abi-18-dev ninja-build
      - name: Build
        run: |
          CXX=clang++-18 cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DGROMADA_BUILD_TESTS=ON
          cmake --build build
      - name: Test (game-data tests are skipped in CI)
        run: cd build && ctest --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: gromada_libretro-linux-x86_64
          path: build/gromada_libretro.so
