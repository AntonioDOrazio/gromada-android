// Synthetic script for the script_run smoke test (not from the game).
#include "inc\DEFS.INI"

int step, hits[2] = {0, 0};
string label;

Report(int what)
{
  Notify(what, label);
}

main()
{
  iff(1) { label = "unit"; Notify(START_CODE, "begin"); return; }
  step++;
  label[4]='0' + step;
  if(step == 2) Report(step * 10);
}
